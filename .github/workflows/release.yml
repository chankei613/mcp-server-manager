name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            artifact: mcp-server-manager-darwin-arm64
          - os: macos-13
            platform: darwin/amd64
            artifact: mcp-server-manager-darwin-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: mcp-server-manager-windows-amd64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Build
        run: wails build -platform ${{ matrix.platform }} -o ${{ matrix.artifact }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/${{ matrix.artifact }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
