name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install CGO deps (sqlite3)
        run: sudo apt-get install -y gcc
      - run: go test ./...

  frontend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Type check + unit tests
        run: npm test
        working-directory: frontend
      - name: ESLint
        run: npx eslint src/
        working-directory: frontend

  e2e:
    runs-on: ubuntu-latest
    needs: [go-test, frontend-unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true
      - name: Install system deps (Wails + CGO)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgtk-3-dev libwebkit2gtk-4.0-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0
      - name: Install frontend deps
        run: npm ci --legacy-peer-deps
        working-directory: frontend
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start wails dev server
        run: |
          # wails dev をバックグラウンドで起動（ヘッドレス環境用）
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x720x24 &
          wails dev -noreload &
          # サーバーが起動するまで待機
          timeout 60 bash -c 'until curl -sf http://localhost:34115 > /dev/null 2>&1; do sleep 2; done'
        working-directory: /home/runner/work/mcp-server-manager/mcp-server-manager
      - name: Run E2E tests
        run: npm run e2e
        working-directory: frontend
        env:
          DISPLAY: :99
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
